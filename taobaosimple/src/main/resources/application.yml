server:
  port: 8081

spring:
  application:
    name: taobaosimple

  datasource:
    url: jdbc:mysql://localhost:3306/taobaosimple?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${DB_USERNAME:root}
    # 本地开发默认密码；部署时请使用 DB_PASSWORD 环境变量覆盖
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.example.taobaosimple.dao
  configuration:
    map-underscore-to-camel-case: true

pagehelper:
  helper-dialect: mysql
  reasonable: true
  support-methods-arguments: true

jwt:
  # 本地开发默认密钥；部署时必须使用 JWT_SECRET 环境变量覆盖
  secret: ${JWT_SECRET:Mpcat6XQYQARN/ml6zNFzASC81sNh8yiPlJBSU2VmLA=}
  expiration-ms: ${JWT_EXPIRATION_MS:7200000}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs